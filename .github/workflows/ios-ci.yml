name: iOS CI

# Scoped to paths that can actually break :shared's iOS compile, unlike
# android-ci.yml's Android job which runs on every push/PR to main/develop - macOS
# runners bill at a 10x minute multiplier, so this shouldn't fire on
# unrelated work. Deliberately excludes iosApp/** - this job doesn't build
# the Xcode project (see the job's own comment for why), so changes there
# wouldn't be verified by anything this job actually runs.
#
# Two cost-driven choices, checked against this workflow's own run history
# (4 runs so far, ~140 billed minutes at the 10x multiplier - more than
# android-ci.yml's 21 runs cost in total, at 1x):
#
# 1. No `push` trigger. Only `pull_request` runs this job. A `push` trigger
#    on main/develop re-runs the exact same tree a second time the moment an
#    already-green PR gets merged (a merge commit with no conflicts has an
#    identical tree to the branch that was just tested) - one of this
#    workflow's first 4 runs was exactly that, a fully redundant re-test.
#    This relies on :shared changes always landing via PR, which has held
#    every time so far - if that stops being true, this job stops covering
#    direct-to-develop shared/ changes until the next PR touches them.
#
# 2. Paths narrowed from a blanket `shared/**` to only the source sets that
#    can actually affect the iOS target: `commonMain`, `iosMain`, and
#    `commonTest` (all three compile for/run on iosSimulatorArm64Test).
#    `shared/src/androidMain/**` and `shared/src/androidHostTest/**` are
#    Android/JVM-only and can never break an iOS build, so they're excluded
#    - previously any edit there still fired this whole macOS job for
#    nothing.
#
# The actual structural fix - self-hosted runners aren't billed by GitHub
# Actions minutes at all, removing the 10x multiplier entirely rather than
# just reducing what triggers it - is deliberately not done here; see
# docs/kmp-knowledge/kmp-knowledge-base.md §13 for that as a standalone
# future project (it'd also fix the Xcode-version-skew problem below, for
# free, since a local Mac already has the correct Xcode).
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "shared/src/commonMain/**"
      - "shared/src/iosMain/**"
      - "shared/src/commonTest/**"
      - "shared/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios-ci.yml"

jobs:
  shared-ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles :shared for iosArm64/iosSimulatorArm64 and runs its
      # commonTest suite on the simulator target - pure Gradle/Kotlin-Native,
      # no Xcode involved at all.
      - name: Build and test :shared for iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      # Deliberately NOT building iosApp itself here - real finding from
      # this workflow's first two CI runs: this project's .pbxproj needs
      # Xcode 27.0+ (objectVersion 110, per the iOS extension guide's own
      # finding), but every Xcode on GitHub's macos-latest image tops out
      # at 26.6 ("cannot be opened because it is in a future Xcode project
      # file format"). No already-installed version on the runner works
      # around this, and guessing a lower objectVersion to hand-edit the
      # project down to isn't safe without a real Xcode 26.x install to
      # verify against (violates this project's own "verify, don't guess"
      # discipline). This also matches how most KMP projects actually draw
      # this CI line: Kotlin/Native's iOS compilation is pure Gradle/no
      # Xcode, so :shared can be verified in plain CI; the Xcode app-shell
      # build is commonly left to Xcode Cloud (always on Apple's current
      # Xcode, no lag) or manual verification instead, specifically because
      # of this exact class of GitHub-hosted-runner/Xcode-version gap.
      # Revisit once GitHub's runner image adds Xcode 27.x.

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-reports
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test/
            shared/build/test-results/iosSimulatorArm64Test/
          retention-days: 7
