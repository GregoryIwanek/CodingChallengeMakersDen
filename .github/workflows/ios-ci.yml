name: iOS CI

# Scoped to paths that can actually break the iOS side, unlike ci.yml's
# Android job which runs on every push/PR to main/develop - macOS runners
# bill at a 10x minute multiplier, so this shouldn't fire on unrelated work
# (see kmp-interview-prep/execution-plan's step 8 iOS guide, §7).
on:
  push:
    branches: [main, develop]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/libs.versions.toml"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/libs.versions.toml"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios-ci.yml"

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles :shared for iosArm64/iosSimulatorArm64 and runs its
      # commonTest suite on the simulator target - run first so the
      # Kotlin/Native toolchain download (a real, one-time few-hundred-MB
      # cost, per the iOS extension guide's own §1) is shared with, not
      # duplicated by, the Xcode build's embed step below.
      - name: Build and test :shared for iOS
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

      # Real finding from this workflow's first CI run: macos-latest's
      # *default* Xcode (selected by `xcode-select`) was 26.6, but this
      # project's .pbxproj was created with Xcode 27.0 (project format
      # 110, per the iOS extension guide's own finding) - Xcode 26.6
      # can't even open it ("future Xcode project file format"). Select
      # the newest Xcode actually installed on the runner rather than
      # trust the default, and print what's available either way so a
      # future failure here is diagnosable from the log, not a guess.
      - name: Select newest available Xcode
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST_XCODE" ]; then
            echo "No /Applications/Xcode_*.app found, falling back to /Applications/Xcode.app"
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      # generic/platform=iOS Simulator is a build-only destination - it
      # doesn't require any specific simulator device/OS version to exist
      # on the runner, unlike actually booting and running on one would.
      # CODE_SIGNING_ALLOWED=NO because this runner's keychain has no
      # signing identity, unlike a local Mac's ad-hoc "Sign to Run Locally".
      - name: Build iosApp
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-reports
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test/
            shared/build/test-results/iosSimulatorArm64Test/
          retention-days: 7
