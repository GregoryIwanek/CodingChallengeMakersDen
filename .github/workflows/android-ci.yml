name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Paparazzi requires the Gradle daemon to run on Java 21+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cheap formatting check first, so a style violation fails fast instead
      # of waiting on the full test/lint/Paparazzi run below.
      - name: Run ktlint
        run: ./gradlew ktlintCheck --console=plain

      # Unit tests, lint, and Paparazzi golden-image verification. Also
      # re-runs ktlintCheck, but that's a no-op cache hit from the step above.
      - name: Run checks
        run: ./gradlew check --console=plain

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/paparazzi/
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/
            shared/build/reports/tests/
            shared/build/reports/ktlint/
            feature/detail/build/reports/tests/
            feature/detail/build/reports/paparazzi/
            feature/detail/build/reports/lint-results-debug.html
            feature/detail/build/reports/ktlint/
          retention-days: 7
